name: Documentation or website issue
description: Report a factual error, broken link, or technical issue.
title: "[Issue]: "
labels: ["triage"]
body:
  - type: textarea
    id: issue
    attributes:
      label: What is wrong?
      description: Describe the issue clearly.
    validations:
      required: true
  - type: input
    id: evidence
    attributes:
      label: Evidence or URL
      description: Link to the affected page or supporting evidence.
    validations:
      required: false
